name: Auto Commit Activity Pulse

on:
  schedule:
    # Berjalan 7 kali sehari (setiap ~3 jam di menit ke-23)
    # WIB: ~08:23, ~11:23, ~14:23, ~17:23, ~20:23, ~23:23, ~02:23
    # Menghasilkan total 6 - 10 commit acak per hari secara merata dan natural
    - cron: '23 1,4,7,10,13,16,19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Paksa buat batch commit sekarang (bypass limit)?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  activity-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Activity Bot
        env:
          GIT_NAME: ${{ vars.GIT_NAME || 'radityabhardana' }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL || 'rexnabagus@gmail.com' }}
          FORCE_COMMIT: ${{ github.event.inputs.force == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force != 'false') }}
        run: node bot.js

      - name: Push changes to GitHub
        run: |
          git push origin HEAD
