name: Auto Commit Activity Pulse

on:
  schedule:
    # Berjalan 2x per jam di menit ke-18 dan ke-48 (48 slot evaluasi per hari)
    # Jadwal acak dinamis di bot.js:
    # - Mayoritas hari: 3 - 17 commit per hari
    # - Hari santai/minimal: 1 - 2 commit
    # - Hari libur (off-day): 0 commit (probabilitas sangat kecil ~1.8%)
    # - Jam tidur WIB (02:00 - 06:59): 97% jeda tidur
    - cron: '18,48 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Paksa buat batch commit sekarang (bypass limit & jadwal)?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  activity-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Activity Bot
        env:
          GIT_NAME: ${{ vars.GIT_NAME || 'radityabhardana' }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL || 'rexnabagus@gmail.com' }}
          FORCE_COMMIT: ${{ github.event.inputs.force == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force != 'false') }}
        run: node bot.js

      - name: Push changes to GitHub
        run: |
          git pull --rebase origin main || true
          git push origin HEAD
